:root{--teal:#078b91;--navy:#15324c;--bg:#f4f8fa;--muted:#617787}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.65 system-ui,Segoe UI,sans-serif}a{color:var(--teal)}header{background:white;border-bottom:1px solid #dce8ed;padding:16px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center}.brand{font-weight:850;text-decoration:none}.hero{background:linear-gradient(120deg,#078b91,#153b5d);color:white;padding:32px;border-radius:20px;margin:24px 0}.hero h1{line-height:1.2;margin:6px 0}.muted{color:var(--muted)}.hero p{color:#e8fbfb}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.tab,.btn{border:1px solid #b6d5d7;background:white;border-radius:10px;padding:10px 15px;cursor:pointer;font:inherit;font-weight:700;color:var(--navy)}.tab[aria-selected=true],.btn.primary{background:var(--teal);color:white}.card{background:white;border:1px solid #dce8ed;border-radius:18px;padding:24px;margin:16px 0}.label{display:inline-block;background:#e2f5f2;color:#067e84;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:750}.example{background:#e9f7f5;padding:16px;border-radius:12px;white-space:pre-wrap}.quiz{padding:16px;border:1px solid #dce8ed;border-radius:12px;margin:14px 0}.options{display:grid;gap:8px}.option{display:block;border:1px solid #d2e2e5;border-radius:9px;padding:9px;cursor:pointer}.option:has(input:checked){background:#e4f5f1;border-color:#078b91}.feedback{font-size:14px;margin-top:10px;padding:10px;background:#f0f6f8;border-radius:8px}.good{color:#087b4a}.bad{color:#b13a36}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.progress{height:9px;background:#e6edf0;border-radius:12px;overflow:hidden}.bar{height:100%;background:var(--teal);width:0}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lesson-link{text-align:left;border:1px solid #dce8ed;border-radius:12px;background:white;padding:13px;cursor:pointe </style></head><body><header><div class="wrap top"><a class="brand" href="index.html">📘 TÜRKÇE AKADEMİ</a><div><a href="a1-tanisalim.html">Tanışalım</a> · <a href="index.html#dersler">Tüm dersler</a></div></div></header><main class="wrap"><div class="hero"><span>A1 · 1. ÜNİTE</span><h1>Dil Bilgisi ve Çalışma Kitabı</h1><p>10 konu anlatımı, 10 uygulama çalışması, 40 açıklamalı etkileşimli soru ve ünite sonu tekrar. Konuyu öğren, uygula, cevabını kontrol et.</p></div><div class="tabs" role="tablist" aria-label="Kitap türü"><button id="grammarTab" class="tab" aria-selected="true">📖 Dil Bilgisi Kitabı</button><button id="workbookTab" class="tab" aria-selected="false">✍️ Çalışma Kitabı</button><button id="overviewTab" class="tab" aria-selected="false">📚 Tüm Konular</button></div><div id="view" aria-live="polite"></div></main><footer>Türkçe Akademi · A1 · 1. Ünite · Eğitim amaçlı özgün içerik</footer><script>
const DATA=[{"n":1,"title":"Türk Alfabesi","desc":"Türk alfabesinde 29 harf vardır. Q, W, X alfabede yer almaz. Harf adlarını ve seslerini ayırt et.","examples":"A a · B b · C c · Ç ç · D d · E e · F f · G g · Ğ ğ · H h · I ı · İ i · J j · K k · L l · M m · N n · O o · Ö ö · P p · R r · S s · Ş ş · T t · U u · Ü ü · V v · Y y · Z z","questions":[{"q":"Hangi harf Türk alfabesinde bulunmaz?","opts":["W","Ç","Ş"],"correct":0,"why":"Türk alfabesinde W yoktur."},{"q":"Türk alfabesinde kaç harf vardır?","opts":["29","26","30"],"correct":0,"why":"29 harf vardır."},{"q":"Hangisi doğru yazılmıştır?","opts":["öğrenci","ogrenci","ögrenci"],"correct":0,"why":"Ö ve ğ seslerini koru."},{"q":"Hangi harf alfabede vardır?","opts":["Ğ","X","Q"],"correct":0,"why":"Ğ Türk alfabesindedir."}]},{"n":2,"title":"Ünlüler ve Ünsüzler","desc":"Türkçede 8 ünlü vardır: a, e, ı, i, o, ö, u, ü. Diğer 21 harf ünsüzdür.","examples":"Kalın ünlüler: a, ı, o, u. İnce ünlüler: e, i, ö, ü.","questions":[{"q":"Hangi harf ünlüdür?","opts":["ü","ş","k"],"correct":0,"why":"Ü bir ünlüdür."},{"q":"Hangisi kalın ünlüdür?","opts":["ı","i","ö"],"correct":0,"why":"I/ı kalın ünlüdür."},{"q":"Hangisi ince ünlüdür?","opts":["e","a","u"],"correct":0,"why":"E ince ünlüdür."},{"q":"Kalem kelimesinde kaç ünlü vardır?","opts":["2","3","1"],"correct":0,"why":"a ve e olmak üzere iki ünlü vardır."}]},{"n":3,"title":"Türkçeye Özgü Sesler","desc":"Ç, Ğ, I, İ, Ö, Ş, Ü harflerinin yazılış ve ses özelliklerine dikkat et. I/ı ile İ/i farklı harflerdir.","examples":"kır · kir / göz · gez / gül · gul (sonuncusu standart Türkçe kelime değildir). Ğ çoğunlukla önceki ünlünün telaffuzunu etkiler.","questions":[{"q":"Hangisi doğru kelimedir?","opts":["şeker","seker","şekar"],"correct":0,"why":"Ş sesi ş harfiyle yazılır."},{"q":"Göz kelimesinde hangi ünlü vardır?","opts":["ö","o","ü"],"correct":0,"why":"Göz ö ile yazılır."},{"q":"Türkçede I harfinin küçüğü nedir?","opts":["ı","i","İ"],"correct":0,"why":"I → ı; İ → i."},{"q":"Hangisi doğru yazılır?","opts":["ağaç","agaç","ağac"],"correct":0,"why":"Ağaç sözcüğünde ğ ve ç vardır."}]},{"n":4,"title":"Heceleme ve Harf Harf Söyleme","desc":"Her hecede bir ünlü bulunur. Sözcükleri hecelerine ayırırken ünlüleri saymak yardımcı olur.","examples":"ki-tap · öğ-ren-ci · ar-ka-daş · sa-at · ü-ni-ver-si-te","questions":[{"q":"Öğrenci kaç hecelidir?","opts":["3","2","4"],"correct":0,"why":"öğ-ren-ci."},{"q":"Arkadaş nasıl hecelenir?","opts":["ar-ka-daş","ark-a-daş","a-rkadaş"],"correct":0,"why":"ar-ka-daş."},{"q":"Saat kaç hecelidir?","opts":["2","1","3"],"correct":0,"why":"sa-at."},{"q":"Üniversite kaç hecelidir?","opts":["5","4","6"],"correct":0,"why":"ü-ni-ver-si-te."}]},{"n":5,"title":"Büyük Ünlü Uyumu","desc":"Bir sözcüğün ünlüleri genel olarak ya kalın ya da ince olur. Bazı sözcükler bu uyuma uymaz. -lar/-ler seçiminde son ünlüye bakılır.","examples":"kitap → kitaplar; defter → defterler; göz → gözler; okul → okullar.","questions":[{"q":"Hangisi büyük ünlü uyumuna uyar?","opts":["gözlük","kalem","kitap"],"correct":0,"why":"Ö ve ü ince ünlüdür."},{"q":"Kitap çoğulu hangisidir?","opts":["kitaplar","kitapler","kitaplor"],"correct":0,"why":"Son ünlü a → -lar."},{"q":"Çiçek çoğulu hangisidir?","opts":["çiçekler","çiçeklar","çiçeklur"],"correct":0,"why":"Son ünlü e → -ler."},{"q":"Okul çoğulu hangisidir?","opts":["okullar","okuller","okullir"],"correct":0,"why":"Son ünlü u → -lar."}]},{"n":6,"title":"Ülke ve Şehir Bildiren Ekler","desc":"-lı/-li/-lu/-lü coğrafi köken bildirir. Ülke kökeni ile milliyet adı her zaman aynı değildir.","examples":"Türkiye → Türkiyeli → Türkiyeliyim. Kırgızistan → Kırgızistanlıyım. İzmir → İzmirliyim. Bolu → Boluluyum. Milliyet: Türküm, Kırgızım.","questions":[{"q":"Türkiye kökenini hangisi bildirir?","opts":["Türkiyeliyim","Türküm","Türkçe"],"correct":0,"why":"Türkiyeliyim coğrafi kökendir."},{"q":"Kırgızistan kökeni hangisidir?","opts":["Kırgızistanlıyım","Kırgızistanliyim","Kırgızistanluyum"],"correct":0,"why":"Son ünlü a → -lı."},{"q":"İzmir için doğru biçim hangisidir?","opts":["İzmirliyim","İzmirlıyım","İzmirluyum"],"correct":0,"why":"Son ünlü i → -li."},{"q":"Milliyet bildiren hangisidir?","opts":["Türküm","Ankaralıyım","Türkiyeliyim"],"correct":0,"why":"Türküm milliyet adıdır."}]},{"n":7,"title":"Kişi Zamirleri ve Kişi Ekleri","desc":"Ben, sen, o, biz, siz, onlar. İsim ve sıfat yüklemlerinde kişi ekleri değişir.","examples":"Ben öğrenciyim. Sen öğrencisin. O öğrenci. Biz öğrenciyiz. Siz öğrencisiniz. Onlar öğrenciler.","questions":[{"q":"Ben öğrenci...","opts":["yim","sin","yiz"],"correct":0,"why":"Ben öğrenciyim."},{"q":"Sen Türk...","opts":["sün","üm","üz"],"correct":0,"why":"Sen Türksün."},{"q":"Biz mutlu...","opts":["yuz","yum","sunuz"],"correct":0,"why":"Biz mutluyuz."},{"q":"Siz öğretmen...","opts":["siniz","iz","im"],"correct":0,"why":"Siz öğretmensiniz."}]},{"n":8,"title":"Olumsuzluk ve Soru","desc":"İsim cümlesinde değil ayrı yazılır, kişi eki değil kelimesine gelir. Soru parçacığı mı/mi/mu/mü ayrı yazılır, kişi eki parçacığa bitişir.","examples":"Öğrenciyim → Öğrenci değilim → Öğrenci miyim? Türküm → Türk değilim → Türk müyüm? Sen öğrenci değil misin?","questions":[{"q":"Ben öğretmenim olumsuzu?","opts":["Öğretmen değilim.","Öğretmen değilsin.","Öğretmenim değil."],"correct":0,"why":"Ben için değilim."},{"q":"Sen öğrenci...?","opts":["misin","mısın","musun"],"correct":0,"why":"Son ünlü i → mi."},{"q":"Sen Türk...?","opts":["müsün","musun","misin"],"correct":0,"why":"Son ünlü ü → mü."},{"q":"Doğru olumsuz soru hangisi?","opts":["Öğrenci değil misin?","Öğrenci değilmisin?","Öğrenci değilsin mi?"],"correct":0,"why":"Değil + mi + sin."}]},{"n":9,"title":"Dil Adları ve Telaffuz","desc":"Dil adları çoğunlukla -ca/-ce/-ça/-çe ile oluşur; yerleşik dil adlarını ayrıca öğrenmek gerekir. Dil adları büyük harfle başlar.","examples":"Türkçe, Kırgızca, Rusça, İngilizce, Arapça, İtalyanca, Japonca, Almanca, Fransızca, Çince.","questions":[{"q":"Türkiye'nin dili?","opts":["Türkçe","Türkce","Türkiyeca"],"correct":0,"why":"Türkçe doğru yazımdır."},{"q":"Kırgızistan'ın devlet dillerinden biri?","opts":["Kırgızca","Kırgızçe","Kırgızce"],"correct":0,"why":"Kırgızca."},{"q":"İtalya'nın dili?","opts":["İtalyanca","İtalyaca","İtalyança"],"correct":0,"why":"İtalyanca."},{"q":"Dil adı hangisi?","opts":["İngilizce","İngiltere","İngiliz"],"correct":0,"why":"İngilizce bir dil adıdır."}]},{"n":10,"title":"Karma Tekrar ve Değerlendirme","desc":"İlk dokuz konuyu birlikte kullan: adını söyle, nereli olduğunu belirt, milliyetini ve konuştuğun dilleri anlat, soru sor, olumsuz cevap ver.","examples":"Merhaba, ben Elif. Türkiyeliyim, Türküm. Türkçe konuşuyorum. Sen Kırgızistanlı mısın? Hayır, İtalyalıyım.","questions":[{"q":"Hangi cümle doğru?","opts":["Ben öğrenciyim.","Ben öğrencisin.","Ben öğrenciyiz."],"correct":0,"why":"Ben için -yim."},{"q":"Hangisi doğru sorudur?","opts":["Türk müsün?","Türk musun?","Türkmüsün?"],"correct":0,"why":"Mü ayrı yazılır."},{"q":"Hangisi dil adıdır?","opts":["Japonca","Japonyalı","Japonya"],"correct":0,"why":"Japonca dil adıdır."},{"q":"Hangi çoğul doğru?","opts":["defterler","defterlar","defterlir"],"correct":0,"why":"Son ünlü e → -ler."}]}];let mode="grammar",index=0;const answers={};const checked={};const $=id=>document.getElementById(id);function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function btn(text,click,cls="btn"){const b=el("button",cls,text);b.type="button";b.addEventListener("click",click);return b}function switchMode(m){mode=m;for(const [id,v] of [["grammarTab","grammar"],["workbookTab","workbook"],["overviewTab","overview"]])$(id).setAttribute("aria-selected",String(m===v));render()}$("grammarTab").onclick=()=>switchMode("grammar");$("workbookTab").onclick=()=>switchMode("workbook");$("overviewTab").onclick=()=>switchMode("overview");function select(i,m){index=i;switchMode(m);window.scrollTo({top:0,behavior:"smooth"})}function render(){const root=$("view");root.replaceChildren();if(mode==="overview"){const box=el("section","card");box.append(el("h2",null,"1. Ünite İçindekiler"));box.append(el("p","muted","Bir konuyu açmak için Dil Bilgisi veya Çalışma Kitabı düğmesine bas."));const grid=el("div","list");DATA.forEach((d,i)=>{const c=el("div","quiz");c.append(el("strong",null,(i+1)+". "+d.title));const a=el("div","actions");a.append(btn("Konu anlatımı",()=>select(i,"grammar")),btn("Alıştırmalar",()=>select(i,"workbook")));c.append(a);grid.append(c)});box.append(grid);root.append(box);return}const d=DATA[index];const nav=el("div","list");DATA.forEach((item,i)=>nav.append(btn((i+1)+". "+item.title,()=>select(i,mode),"lesson-link")));const card=el("article","card");card.append(el("span","label",(mode==="grammar"?"DİL BİLGİSİ ":"ÇALIŞMA ")+d.n+" / 10"));card.append(el("h2",null,d.title));if(mode==="grammar"){card.append(el("h3",null,"Neler öğreneceğim?"));card.append(el("p",null,d.desc));card.append(el("h3",null,"Kural ve örnekler"));card.append(el("div","example",d.examples));card.append(el("h3",null,"Günlük hayatta nasıl kullanırım?"));card.append(el("p",null,"Konuyu arkadaşınla örnekler üzerinden çalış. Cümleleri yüksek sesle oku, sonra kendi bilgilerinle yeni cümleler kur."));card.append(btn("Bu konunun alıştırmalarını çöz →",()=>switchMode("workbook"),"btn primary"))}else{card.append(el("p",null,"Önce konuyu hatırla, ardından dört soruyu cevapla. Her cevabın açıklamasını görebilirsin."));card.append(el("div","example",d.examples));const key=d.n;d.questions.forEach((q,i)=>{const item=el("div","quiz");item.append(el("strong",null,(i+1)+". "+q.q));const opts=el("div","options");q.opts.forEach((opt,j)=>{const label=el("label","option");const radio=document.createElement("input");radio.type="radio";radio.name="q"+key+"_"+i;radio.value=j;radio.checked=answers[key+"_"+i]===j;radio.onchange=()=>{answers[key+"_"+i]=j;checked[key]=false;render()};label.append(radio,document.createTextNode(" "+opt));opts.append(label)});item.append(opts);if(checked[key]){const good=answers[key+"_"+i]===q.correct;const f=el("div","feedback");f.append(el("strong",good?"good":"bad",good?"✓ Doğru!":"Doğru cevap: "+q.opts[q.correct]));f.append(el("div",null,q.why));item.append(f)}card.append(item)});const done=d.questions.every((q,i)=>answers[key+"_"+i]!==undefined);const controls=el("div","actions");const check=btn("Cevaplarımı kontrol et",()=>{checked[key]=true;render()},"btn primary");check.disabled=!done;controls.append(check,btn("Tekrar çöz",()=>{d.questions.forEach((q,i)=>delete answers[key+"_"+i]);checked[key]=false;render()}));card.append(controls);if(checked[key]){const score=d.questions.filter((q,i)=>answers[key+"_"+i]===q.correct).length;card.append(el("h3",null,"Sonuç: "+score+" / "+d.questions.length+" doğru"))}card.append(el("h3",null,"Konuşma ve yazma görevi"));card.append(el("p",null,"Bu konuyu kullanarak kendinle ilgili üç cümle yaz. Ardından bir arkadaşınla karşılıklı konuş ve yazdıklarını öğretmenine göster."));const area=el("textarea");area.placeholder="Cümlelerini buraya yaz...";area.value=sessionStorage.getItem("a1-writing-"+key)||"";area.oninput=()=>sessionStorage.setItem("a1-writing-"+key,area.value);card.append(area);card.append(el("p","muted","Serbest yazı otomatik puanlanmaz. Öğretmen geri bildirimiyle geliştirilir."))}const bottom=el("div","actions");if(index>0)bottom.append(btn("← Önceki konu",()=>select(index-1,mode)));if(index<9)bottom.append(btn("Sonraki konu →",()=>select(index+1,mode),"btn primary"));else bottom.append(btn("İçindekilere dön",()=>switchMode("overview")));card.append(bottom);root.append(card);const contents=el("section","card");contents.append(el("h3",null,"Diğer konular"));contents.append(nav);root.append(contents)}render();
</script></body></html>
