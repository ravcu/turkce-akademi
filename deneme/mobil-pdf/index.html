<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mobil PDF önizleme · Türkçe Akademi</title><style>*{box-sizing:border-box}body{margin:0;background:#e9f0ec;font:14px system-ui;color:#17343b}header{padding:12px 20px;background:white;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}select,a{font:inherit;padding:9px}a{color:#087f83}main{display:flex;justify-content:center;padding:16px}.device{border:6px solid #17343b;border-radius:24px;overflow:hidden;background:white;box-shadow:0 15px 40px #17343b22}iframe{display:block;border:0;width:390px;height:780px;max-width:none}</style><header><strong>Mobil PDF önizlemesi</strong><label>Ekran <select id="size"><option value="360">360 px</option><option value="390" selected>390 px</option><option value="430">430 px</option><option value="740x360">Yatay telefon</option></select></label><label>Kitap <select id="book"><option value="tanisalim/">A1 Ders Kitabı</option><option value="lise-a2/akilli-teknoloji/">A2 Ders Kitabı</option><option value="lise-a1-dilbilgisi/tanisalim/">A1 Dil Bilgisi</option><option value="lise-a2-dilbilgisi/akilli-teknoloji/">A2 Dil Bilgisi</option></select></label><a href="/turkce-akademi/">Ana sayfaya dön</a></header><main><div class="device"><iframe id="phone" title="Telefon boyutunda PDF okuyucusu" src="/turkce-akademi/kitaplar/tanisalim/?mobile=20261108" allow="fullscreen"></iframe></div></main><script>const f=document.querySelector('#phone');document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split('x');f.style.width=w+'px';f.style.height=(h||780)+'px'};document.querySelector('#book').onchange=e=>{f.src='/turkce-akademi/kitaplar/'+e.target.value+'?mobile=20261108'};</script></html>
