<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Öğrenci Girişi | Türkçe Akademi</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f8fa;color:#17354d;font:16px system-ui,sans-serif}header{text-align:center;background:white;padding:24px}header a{color:#078b91;font-weight:900;font-size:26px;text-decoration:none}header small{display:block;font-size:11px;color:#678}main{max-width:460px;margin:36px auto;padding:16px}.panel{padding:26px;background:white;border:1px solid #d5e6e7;border-radius:18px;box-shadow:0 12px 32px #1232}h1{font-size:22px}.tabs{display:flex;gap:8px}.tabs button{flex:1}button{padding:12px;cursor:pointer;border:1px solid #aad1d2;border-radius:9px;background:white;color:#078b91;font-weight:700}.active,.primary{background:#078b91!important;color:white!important}.primary{width:100%;margin-top:15px}label{font-size:13px;font-weight:700;display:block;margin:13px 0 5px}input{width:100%;padding:12px;border:1px solid #bbd4d7;border-radius:9px;font-size:16px}.hidden{display:none!important}#status{min-height:18px;font-size:14px;color:#a33132}.secondary{border:0}a{color:#078b91}
</style></head><body><header><a href="./">TÜRKÇE AKADEMİ</a><small>DÜNYANIN TÜRKÇE ÖĞRENME PLATFORMU</small></header><main><div class="panel"><h1>Öğrenci Hesabım</h1><p id="setup" class="hidden">Hesap altyapısı henüz yapılandırılmadı.</p><div id="guest"><div class="tabs"><button class="active" id="loginTab" type="button">Giriş Yap</button><button id="registerTab" type="button">Kayıt Ol</button></div><form id="accountForm"><div id="names" class="hidden"><label>Ad<input id="first" maxlength="80" autocomplete="given-name"></label><label>Soyad<input id="last" maxlength="80" autocomplete="family-name"></label></div><label>E-posta<input id="email" type="email" autocomplete="email" required></label><label>Şifre<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><div id="repeatBox" class="hidden"><label>Şifre tekrar<input id="repeat" type="password" autocomplete="new-password" minlength="8"></label></div><p id="status" role="status"></p><button id="submit" class="primary" type="submit">Giriş Yap</button></form><button id="forgot" class="secondary" type="button">Şifremi Unuttum</button></div><div id="signedIn" class="hidden"><p id="greeting"></p><p><a href="./">Eğitimime devam et →</a></p><button id="logout">Çıkış Yap</button></div><div id="passwordRecovery" class="hidden"><h2>Yeni Şifre Belirle</h2><form id="recoveryForm"><label>Yeni şifre<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><label>Yeni şifre tekrar<input id="newPasswordAgain" type="password" minlength="8" autocomplete="new-password" required></label><button class="primary" type="submit">Şifreyi Güncelle</button><p id="recoveryStatus" role="status"></p></form></div></div></main>
<script src="assets/js/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="assets/js/student-cloud.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),api=window.TAStudentCloud;let registration=false;const msg=t=>$('status').textContent=t;
if(!api||!api.ready){$('setup').classList.remove('hidden');$('accountForm').querySelectorAll('input,button').forEach(x=>x.disabled=true);$('forgot').disabled=true;return}
function mode(v){registration=v;$('names').classList.toggle('hidden',!v);$('repeatBox').classList.toggle('hidden',!v);$('first').required=v;$('last').required=v;$('repeat').required=v;$('loginTab').classList.toggle('active',!v);$('registerTab').classList.toggle('active',v);$('submit').textContent=v?'Hesap Oluştur':'Giriş Yap';$('forgot').classList.toggle('hidden',v);msg('')}
$('loginTab').onclick=()=>mode(false);$('registerTab').onclick=()=>mode(true);
async function refresh(){const u=await api.user();$('guest').classList.toggle('hidden',!!u);$('signedIn').classList.toggle('hidden',!u);if(u){const p=await api.profile().catch(()=>null);$('greeting').textContent='Hoş geldiniz, '+(p?p.first_name+' '+p.last_name:u.email);if(p)localStorage.setItem('ta-student-name',p.first_name+' '+p.last_name);try{const last=await api.load('ta-last-location');const link=document.querySelector('#signedIn a');if(last?.path&&typeof last.path==='string'&&last.path.startsWith('/turkce-akademi/')&&!last.path.includes('//')&&!/[<>]/.test(last.path)){link.href=last.path;link.textContent='Kaldığım yerden devam et →'}else{link.href='./';link.textContent='Eğitimime devam et →'}}catch(e){console.warn('Son konum getirilemedi:',e)}}}
$('accountForm').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;msg('');try{let email=$('email').value.trim(),password=$('password').value;
if(registration){let first=$('first').value.trim(),last=$('last').value.trim();if(!first||!last||password!==$('repeat').value){msg('Ad, soyad ve şifre tekrarını kontrol ediniz.');return}
let {data,error}=await api.client.auth.signUp({email,password,options:{data:{first_name:first,last_name:last}}});if(error)throw error;if(data.session){await api.saveProfile(first,last);await refresh()}else msg('E-posta doğrulama bağlantısını kontrol edin; ardından giriş yapın.')}
else{let {error}=await api.client.auth.signInWithPassword({email,password});if(error)throw error;await refresh()}}
catch(err){msg(err.message||'İşlem tamamlanamadı.')}finally{$('submit').disabled=false}};
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){msg('E-posta adresinizi yazınız.');return}const {error}=await api.client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});msg(error?error.message:'Şifre sıfırlama e-postasını kontrol ediniz.')};
$('logout').onclick=async()=>{await api.client.auth.signOut();for(const k of Object.keys(localStorage)){if(k.startsWith('ta-')||k==='sunum-current')localStorage.removeItem(k)}await refresh()};let recovering=false;
$('recoveryForm').onsubmit=async e=>{e.preventDefault();if($('newPassword').value!==$('newPasswordAgain').value){$('recoveryStatus').textContent='Şifreler aynı değil.';return}const {error}=await api.client.auth.updateUser({password:$('newPassword').value});if(error){$('recoveryStatus').textContent=error.message;return}recovering=false;$('passwordRecovery').classList.add('hidden');$('recoveryStatus').textContent='Şifre değiştirildi.';await refresh()};
api.client.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){recovering=true;$('passwordRecovery').classList.remove('hidden');$('guest').classList.add('hidden');$('signedIn').classList.add('hidden')}else if(!recovering)setTimeout(refresh,0)});
refresh();
})();
</script></body></html>
