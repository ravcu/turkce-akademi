name: Import uploaded A2 grammar audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-a2-grammar-audio.yml'
      - 'sesler/Lise-A2-Dilbilgisi-ve-Telaffuz/*.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-a2-grammar-audio
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sesler/Lise-A2-Dilbilgisi-ve-Telaffuz
            kitaplar/lise-a2-dilbilgisi
            docs
          filter: blob:none
      - name: Install audio validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Extract exact recording codes and update manifest
        shell: python
        run: |
          import zipfile,json,re,hashlib,subprocess
          from pathlib import Path
          folder=Path('sesler/Lise-A2-Dilbilgisi-ve-Telaffuz')
          mp=folder/'manifest.json'
          m=json.loads(mp.read_text())
          added=[]
          for archive in folder.glob('*.zip'):
            with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                name=entry.filename
                match=re.fullmatch(r'Lise - A2 - Dil Bilgisi - (\d+)(?:\.(\d+))?\.opus',name)
                if not match:
                  if name.lower().endswith('.opus'): raise ValueError(name)
                  continue
                assert entry.file_size<5000000
                code=f'S.{int(match[1]):03d}'+('.'+match[2] if match[2] else '')
                p=folder/name
                data=z.read(entry)
                assert data.startswith(b'OggS')
                if p.exists():
                  assert p.read_bytes()==data, name
                  continue
                assert code not in m['tracks'], code
                p.write_bytes(data)
                subprocess.run(['ffmpeg','-v','error','-i',str(p),'-f','null','-'],check=True)
                info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
                s=info['streams'][0]
                assert s['codec_name']=='opus'
                dur=float(info['format']['duration'])
                m['tracks'][code]={'number':int(match[1]),'code':code,'file':name,'bytes':len(data),'duration':dur,'encodedDuration':dur,'channels':s['channels'],'sha256':hashlib.sha256(data).hexdigest()}
                added.append(code)
          m['tracks']=dict(sorted(m['tracks'].items(),key=lambda x:list(map(int,x[0][2:].split('.')))))
          m['encodedBytes']=sum(t['bytes'] for t in m['tracks'].values())
          m['durationSeconds']=sum(t['duration'] for t in m['tracks'].values())
          for code,t in m['tracks'].items():
            p=folder/t['file']
            assert p.stat().st_size==t['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==t['sha256']
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          refs=set()
          for p in Path('kitaplar/lise-a2-dilbilgisi').glob('*/pages.json'):
            refs.update(re.findall(r'S\.\d{3}(?:\.\d+)?',p.read_text()))
          missing=sorted(refs-set(m['tracks']))
          print('Added:',len(added),'Available:',len(m['tracks']),'Missing:',missing)
          report=Path('docs/lise-a2-dilbilgisi-sesleri.md')
          text=report.read_text()
          marker='\n## Güncel ses bağlantıları\n'
          text=text.split(marker)[0]
          text+=marker+'\nToplam '+str(len(m['tracks']))+' kayıt PDF DİNLE butonlarına kodlarıyla bağlıdır. ZIP içindeki Opus dosyaları yeniden kodlanmadan çıkarılmış ve tamamı FFmpeg ile doğrulanmıştır. Eksik kodlar: '+', '.join(missing)+'. Alt kayıtlar (S.107.1, S.107.2, S.107.3) ayrı dosyalardır. sourceBytes yalnız kaynak boyutu bilinen ilk paketi kapsar.\n'
          report.write_text(text)
      - name: Publish recordings and manifest together
        run: |
          git add sesler/Lise-A2-Dilbilgisi-ve-Telaffuz docs/lise-a2-dilbilgisi-sesleri.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect uploaded A2 grammar audio to PDF listening buttons'
          git push origin HEAD:main
