name: Lise A1 Dil Bilgisi Seslerini Aç
on:
  push:
    branches: [main]
    paths:
      - 'sesler/Lise A1 dilbilgisi ve telaffuz kitabı ses dosyaları/Lise_A1_Dil_Bilgisi_67_Ses_Opus.zip'
      - 'sesler/Lise A1 dilbilgisi ve telaffuz kitabı ses dosyaları/Lise_A1_Dil_Bilgisi_Yeni_72_Opus.zip'
      - '.github/workflows/lise-a1-dilbilgisi-ses-ac.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lise-a1-dilbilgisi-ses
  cancel-in-progress: false

jobs:
  unzip-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak depoyu indir
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sesleri denetle ve klasöre çıkar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import zipfile

          folder=Path('sesler/Lise A1 dilbilgisi ve telaffuz kitabı ses dosyaları')
          old_name='Lise_A1_Dil_Bilgisi_67_Ses_Opus.zip'
          new_name='Lise_A1_Dil_Bilgisi_Yeni_72_Opus.zip'
          old_expected={str(i) for i in range(1,61)} | {str(i) for i in [64,65,66,67,69,70,71]}
          new_expected={str(i) for i in [61,62,63]} | {str(i) for i in range(72,139)} | {'97-2','104-2'}
          packages=[(folder/old_name,old_expected),(folder/new_name,new_expected)]
          imported=set()
          for archive,expected in packages:
              if not archive.exists():
                  continue
              with zipfile.ZipFile(archive) as z:
                  actual={}
                  for info in z.infolist():
                      if info.is_dir():
                          continue
                      name=info.filename
                      m=re.fullmatch(r'Lise - A1 - Dil Bilgisi - (\d+(?:-\d+)?)\.opus',name)
                      if not m:
                          if name in ('OKU_BENI.txt','boyut_karsilastirmasi.csv'):
                              continue
                          raise SystemExit('Bilinmeyen ZIP içeriği: '+name)
                      code=m.group(1)
                      if code not in expected or code in actual or info.file_size>5_000_000:
                          raise SystemExit('Beklenmeyen, tekrarlı veya büyük ses: '+name)
                      actual[code]=info
                  if set(actual)!=expected:
                      raise SystemExit('ZIP içindeki eksik sesler: '+str(sorted(expected-set(actual))))
                  # Everything checked: unpack without overwriting existing tracks.
                  for code,info in actual.items():
                      dest=folder/info.filename
                      if dest.exists():
                          raise SystemExit('Önceden yüklü sesin üzerine yazılmayacak: '+info.filename)
                      data=z.read(info)
                      if not data.startswith(b'OggS'):
                          raise SystemExit('Geçersiz Ogg/Opus başlığı: '+info.filename)
                      dest.write_bytes(data)
                      imported.add(code)
              archive.unlink()
          if not imported:
              print('Yeni ZIP bulunamadı, değişiklik yapılmadı.')
          else:
              # Enable the matching PDF DİNLE buttons in the same commit as audio files.
              path=Path('assets/js/lise-a1-dilbilgisi-audio.js')
              text=path.read_text(encoding='utf-8')
              updated={str(i) for i in range(1,139) if i!=68} | {'97-2','104-2'}
              pattern=r'const available=new Set\([^;]*\);'
              entries=[int(s) if '-' not in s else s for s in sorted(updated,key=lambda s:(int(s.split('-')[0]),s))]
              replacement='const available=new Set('+repr(entries).replace("'",'"')+');'
              text,count=re.subn(pattern,lambda _:replacement,text,count=1)
              if count!=1:
                  raise SystemExit('DİNLE kayıt listesi güncellenemedi.')
              path.write_text(text,encoding='utf-8')
              print('Yüklenen ses:',len(imported),'Etkin toplam ses:',len(updated))
          PY
      - name: Sesleri ve DİNLE eşleştirmesini kaydet
        shell: bash
        run: |
          set -euo pipefail
          dir='sesler/Lise A1 dilbilgisi ve telaffuz kitabı ses dosyaları'
          git add -A -- "$dir" assets/js/lise-a1-dilbilgisi-audio.js
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lise A1 dilbilgisi yeni Opus seslerini ve DİNLE kayıtlarını ekle [skip ci]'
          git push origin HEAD:main
