<!doctype html><html lang="tr"><meta charset="utf-8"><title>A2 4. Ünite Sunu Modu — geliştirme</title><style>body{background:#121b29;color:white;font-family:Arial;text-align:center}button{padding:12px;margin:6px}img{width:min(96vw,1200px);aspect-ratio:16/9;object-fit:contain}</style><h2>Şimdi Haberler — Sunu Modu</h2><p>Bu sayfa hazırlık aşamasındadır. İlk 10 slaytın 2400 piksel görselleri yerel çalışma paketinde hazırlandı; görseller ve sesler henüz yayımlanmadı.</p><button id="prev">Önceki</button><span id="n">1 / 10</span><button id="next">Sonraki</button><script>let n=1;function update(){document.getElementById('n').textContent=n+' / 10'}document.getElementById('prev').onclick=()=>{n=Math.max(1,n-1);update()};document.getElementById('next').onclick=()=>{n=Math.min(10,n+1);update()};</script></html>
