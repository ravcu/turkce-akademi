<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A2 · 5. Ünite: Dedemin Mesleği Bana Göre mi?</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f3;color:#17343b;font:16px system-ui}header,main{max-width:1180px;margin:auto;padding:20px}a{color:#075d61}h1{font:clamp(26px,4vw,40px) Georgia;margin:12px 0}nav,.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}nav a,button{border:1px solid #a4d3c8;border-radius:10px;background:#fffefa;padding:10px 14px;color:#075d61;text-decoration:none;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.tools{justify-content:center;margin:15px 0}.viewport{overflow:auto;background:#e9efea;border-radius:16px;padding:12px;text-align:center}.page{display:block;width:100%;max-width:900px;height:auto;margin:auto;box-shadow:0 8px 24px #17343b22}.thumbs{display:flex;gap:8px;overflow:auto;padding:16px 0}.thumbs button{flex:0 0 62px;padding:3px;font-size:12px}.thumbs img{width:100%;display:block}.thumbs button[aria-current=true]{outline:2px solid #087f83}.note{background:#fffefa;border:1px solid #dfe9e5;padding:14px;border-radius:12px;font-size:14px;line-height:1.6}small{color:#087f83;font-weight:700}</style><header><a href="../../../">Türkçe Akademi</a><h1>Dedemin Mesleği Bana Göre mi?</h1><small>LİSE A2 · 5. ÜNİTE · 20 SAYFA</small></header><main><nav aria-label="Ünite geçişi"><a href="../simdi-haberler/">← Önceki Ünite · 4. Ünite</a><a href="../../../#dersler">Ünite Listesi</a></nav><div class="tools"><button id="prev">← Önceki Sayfa</button><span id="count" aria-live="polite"></span><button id="next">Sonraki Sayfa →</button><button id="out" aria-label="Uzaklaştır">−</button><button id="in" aria-label="Yakınlaştır">+</button><a id="original" target="_blank" rel="noopener">Tam çözünürlük</a></div><div class="viewport"><img class="page" id="page" alt="5. ünite kitap sayfası"></div><div class="thumbs" id="thumbs" aria-label="Sayfalar"></div><p class="note">Kitabın 20 sayfası görüntülenebilir. Kelime seçimi, beş dilde sözlük ve örnek cümleler henüz eklenmedi.</p></main><script>(()=>{let current=1,zoom=900;const $=s=>document.querySelector(s),src=n=>'../dedemin-meslegi-bana-gore-mi/pages/page-'+String(n).padStart(3,'0')+'.webp';function render(){$('#page').src=src(current);$('#page').alt='5. Ünite · Sayfa '+current;$('#original').href=src(current);$('#count').textContent=current+' / 20';$('#prev').disabled=current===1;$('#next').disabled=current===20;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.page===current)));try{localStorage.setItem('ta-a2-unit5-page',current)}catch{}}for(let n=1;n<=20;n++){const b=document.createElement('button');b.dataset.page=n;const im=document.createElement('img');im.src=src(n);im.loading='lazy';im.alt='';b.append(im,document.createTextNode(n));b.setAttribute('aria-label','Sayfa '+n);b.onclick=()=>{current=n;render()};$('#thumbs').append(b)}$('#prev').onclick=()=>{if(current>1){current--;render()}};$('#next').onclick=()=>{if(current<20){current++;render()}};$('#in').onclick=()=>{zoom=Math.min(3600,zoom+300);$('#page').style.maxWidth=zoom+'px';$('#page').style.width=zoom+'px'};$('#out').onclick=()=>{zoom=Math.max(600,zoom-300);$('#page').style.maxWidth=zoom+'px';$('#page').style.width=zoom===900?'100%':zoom+'px'};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});try{current=Math.max(1,Math.min(20,Number(localStorage.getItem('ta-a2-unit5-page'))||1))}catch{}render()})();</script></html>
