<script>
(() => {
  const speakerClean={};
  const masks={78:[[.091,.400,.277,.092,'#dfeff3'],[.372,.400,.273,.092,'#fbe9e3'],[.65,.400,.275,.092,'#e9f5de'],[.091,.919,.417,.068,'#fff6c7'],[.519,.919,.406,.068,'#e9daf1']]};const assetNumber=s=>Number(s.image.match(/(\d+)\.webp$/)[1]);const cleanOverlay=n=>(masks[assetNumber(slides[n-1])]||[]).map(([x,y,w,h,c])=>`<i aria-hidden="true" style="position:absolute;z-index:6;left:${x*100}%;top:${y*100}%;width:${w*100}%;height:${h*100}%;background:${c};pointer-events:none"></i>`).join('');
  const langs=[{id:'en',label:'EN',flag:'🇬🇧',index:0},{id:'ru',label:'RU',flag:'🇷🇺',index:1},{id:'ky',label:'KY',flag:'🇰🇬',index:2},{id:'ar',label:'AR',flag:'🇸🇦',index:3},{id:'fr',label:'FR',flag:'🇫🇷',index:4}];
  const main=document.getElementById('main'),toast=document.getElementById('toast');let slides=[],spots=[],dict={},answers={},current=0,lang='en',selected=null,audioNodes=[],turnAudio=null,answersVisible=false;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200)}
  async function init(){
    try{
      const [data,hitData,translations,answerData]=await Promise.all([fetch('slides.json?v=lemma-forms-v1').then(r=>r.json()),fetch('word-spots.json?v=lemma-forms-v1').then(r=>r.json()),fetch('translations.json?v=lemma-forms-v1').then(r=>r.json()),fetch('answer-overlays.json').then(r=>r.json())]);
      slides=data.slides;spots=data.slides.map(s=>hitData[assetNumber(s)-1]||[]);dict=translations;answers=answerData;current=Math.min(Number(localStorage.getItem('a2-unit2-sunum-current')||0),slides.length-1);lang=localStorage.getItem('sunum-language')||'en';
      renderShell();document.getElementById('slideImg').onload=()=>{[current-1,current+1].forEach(i=>{if(slides[i]){const preload=new Image();preload.decoding='async';preload.fetchPriority='low';preload.src=slides[i].image}})};renderSlide();
    }catch(e){main.innerHTML='<section class="panel"><h2>Sunum açılamadı</h2><p>Slayt dosyaları yüklenirken bir sorun oluştu. Sayfayı yenileyin.</p></section>';console.error(e)}
  }
  function renderShell(){
    main.innerHTML=`<section class="viewer"><div class="toolbar"><button class="nav-btn" id="prev" aria-label="Önceki slayt">←</button><span class="page-count" id="pageCount"></span><button class="nav-btn" id="next" aria-label="Sonraki slayt">→</button><div class="progress"><span id="progressFill"></span></div><button class="listen toolbar-listen" id="toolbarListen" hidden>▶ DİNLE</button><div class="lesson-audio-panel" id="lessonAudioPanel" hidden><span id="lessonAudioLabel">Dinleme kaydı</span><audio id="lessonAudioPlayer" controls preload="metadata" aria-label="Dinleme kaydı; ileri geri sarma ve süre"></audio></div><button class="nav-btn" id="first" aria-label="İlk slayt">|←</button><button class="nav-btn" id="last" aria-label="Son slayt">→|</button></div><div class="slide-area"><div class="slide-frame" id="frame"><img class="slide-img" id="slideImg" alt="" draggable="false"><button class="page-edge prev" id="edgePrev" aria-label="Önceki sayfa">‹</button><button class="page-edge next" id="edgeNext" aria-label="Sonraki sayfa">›</button><div class="answer-overlay" id="answerOverlay" hidden></div><div id="speakerClean"></div><div id="hotspots"></div></div></div><div class="thumbs" id="thumbs" aria-label="Slayt küçük görselleri"></div></section>
      <aside class="side"><section class="panel languages-panel"><div class="panel-title"><h2>ÇEVİRİ DİLİ</h2><span class="count-pill">${slides.length} slayt</span></div><div class="languages" id="languages"></div><p class="hint" style="margin-top:10px">Slayttaki çevrilebilir bir kelimeye dokunun; kalıp ifadeler birlikte seçilir.</p></section>
      <section class="panel selection" id="translationPanel"><div class="panel-title"><h2>SÖZLÜK VE ÖRNEK</h2><span class="count-pill" id="hitCount"></span></div><div class="empty"><div><div class="finger">☝️</div>Slayttaki vurgulanabilir kelimelerden birine dokunun.<br>Anlam ve örnek seçtiğiniz dilde görünür.</div></div></section>
      <section class="panel" id="answerPanel" hidden><div class="panel-title"><h2>ETKİNLİK CEVAPLARI</h2><span class="count-pill">İsteğe bağlı</span></div><div class="answer-controls"><button class="answer-toggle" id="answerToggle" aria-pressed="false">Cevabı göster</button><span class="answer-status" id="answerStatus">Cevaplar gizli</span></div></section><p class="bottom-note">DİNLE slayt sesini oynatır. Kelime ve örneklerin 🔊 düğmeleriyle seslendirmesini dinleyin.</p></aside>`;
    document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('edgePrev').onclick=()=>go(current-1);document.getElementById('edgeNext').onclick=()=>go(current+1);document.getElementById('first').onclick=()=>go(0);document.getElementById('last').onclick=()=>go(slides.length-1);
    document.getElementById('languages').innerHTML=langs.map(l=>`<button class="lang ${l.id===lang?'active':''}" data-lang="${l.id}" aria-label="${l.label}"><span>${l.flag}</span>${l.label}</button>`).join('');
    document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('sunum-language',lang);document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x===b));if(selected)showEntry(selected)});

    document.getElementById('fullBtn').onclick=()=>{const el=document.documentElement;if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});

  function showEntry(hit){
    const idx=langs.find(x=>x.id===lang)?.index??0,key=hit.key||hit.text.toLowerCase(),phrase=dict.phrases?.[key],form=dict.forms?.[key],word=dict.words?.[key],ex=dict.examples?.[key];
    const item=phrase||form||word;const transArr=phrase?.translations||form?.formTranslations||word;
    const lemma=lemmaForms[key]||form?.lemma||key;
    const exampleTr=phrase?.exampleTr||form?.exampleTr||ex?.[0];const exampleTranslations=phrase?.examples||form?.examples||ex?.[1];
    const panel=document.getElementById('translationPanel');panel.querySelector('.empty').style.display='none';panel.querySelectorAll('.entry-content').forEach(n=>n.remove());
    const el=document.createElement('div');el.className='entry-content';
    const displayText=hit.displayText||canonicalDisplay(hit),targetLang=langs[idx].id;
    if(!item){el.innerHTML=`<div class="type-label">${langs[idx].label} · TÜRKÇE İFADE</div><div class="word-heading"><h3 class="word-title">${esc(displayText)}</h3>${speechButton(displayText,'tr')}</div><div class="translation">Bu kelime için çeviri kaydı bulunamadı.</div>`;}
    else{
      const translation=transArr?.[idx]||'—';
      const lemmaEntry=dict.words?.[lemma]||dict.words?.[normalized(lemma)];const lemmaTranslation=form?.lemmaTranslations?.[idx]||lemmaEntry?.[idx];
      const translationSpeech=speechRow(translation,targetLang);
      const baseForm=phrase?(lemmaForms[key]||phrase.lemma||key):lemma;
      const baseMeaning=phrase?null:lemmaTranslation;
      const formTranslation=`<div class="translation"><div class="type-label">YALIN BİÇİM</div><div class="word-heading"><strong class="lemma-text">${esc(baseForm)}</strong>${speechButton(baseForm,'tr','Yalın biçimi Türkçe dinle')}</div>${baseMeaning&&normalized(baseForm)!==normalized(key)?speechRow(baseMeaning,targetLang):''}</div><div class="form-translation"><div class="type-label">METİNDEKİ BİÇİM</div><div class="word-heading"><strong class="surface-text">${esc(displayText)}</strong>${speechButton(displayText,'tr','Metindeki biçimi Türkçe dinle')}</div>${translationSpeech}</div>`;
      const exampleBlock=exampleTr?`<div class="example"><strong>ÖRNEK CÜMLE · ${langs[idx].label}</strong>${speechRow(exampleTr,'tr')}${exampleTranslations?.[idx]?speechRow(exampleTranslations[idx],targetLang,'translated'):''}</div>`:'';
      el.innerHTML=`<div class="type-label">${phrase?'KALIP İFADE':form?'KİTAPTAKİ BİÇİM':'KELİME'} · ${langs[idx].label}</div><div class="word-heading"><h3 class="word-title">${esc(displayText)}</h3>${speechButton(displayText,'tr','Türkçe ifadeyi dinle')}</div>${formTranslation}${exampleBlock}`;
    }
