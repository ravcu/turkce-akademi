<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lise A2 • 1. Ünite Tatil Dönüşü | Türkçe Akademi</title>
<style>:root{font-family:system-ui,Arial,sans-serif;color:#183944;background:#f1f6f6}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #d9e5e5}a{color:#087d83}h1{font-size:19px;margin:0}main{max-width:1120px;margin:auto;padding:20px 12px 40px}.toolbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{background:white;color:#0c5962;border:1px solid #a6d0d0;border-radius:9px;padding:10px 14px;font-size:15px;cursor:pointer}button:disabled{opacity:.4;cursor:default}#viewport{overflow:auto;max-height:78vh;background:#dfe9e9;border-radius:12px;text-align:center;padding:12px;box-shadow:0 9px 30px #143c4214}#page{display:block;margin:auto;width:100%;height:auto;max-width:none;box-shadow:0 4px 20px #153d4325}#status{font-size:14px;color:#50666c}.note{font-size:13px;color:#586c71;text-align:center;line-height:1.6}</style></head>
<body><header><div><strong>Türkçe Akademi</strong><h1>Lise A2 · 1. Ünite: Tatil Dönüşü</h1></div><a href="../../../index.html">Ana sayfa</a></header>
<main><div class="toolbar"><button id="prev">← Önceki sayfa</button><strong id="counter"></strong><button id="next">Sonraki sayfa →</button><button id="minus">−</button><span id="zoom">100%</span><button id="plus">+</button><button id="reset">Sıfırla</button></div><div id="viewport"><img id="page" alt="Ders kitabı sayfası"></div><p id="status" aria-live="polite"></p><p class="note">İlk sürüm: yüksek çözünürlüklü sayfa görüntüleyici. Kelime sözlüğü, sesler ve etkinlik cevapları sonraki aşamada eklenecektir.</p></main>
<script>const total=22;let index=0,scale=1;const $=id=>document.getElementById(id);function render(){const n=String(index+1).padStart(2,'0');$('page').src='pages/sayfa_'+n+'.webp';$('page').style.width=(scale*100)+'%';$('counter').textContent='Sayfa '+(index+1)+' / '+total+' (Kitap: '+(index+9)+')';$('zoom').textContent=Math.round(scale*100)+'%';$('prev').disabled=index===0;$('next').disabled=index===total-1;$('status').textContent='';}function go(delta){index=Math.max(0,Math.min(total-1,index+delta));render();$('viewport').scrollTop=0;$('viewport').scrollLeft=0;}$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('minus').onclick=()=>{scale=Math.max(.5,Math.round((scale-.25)*100)/100);render()};$('plus').onclick=()=>{scale=Math.min(4,Math.round((scale+.25)*100)/100);render()};$('reset').onclick=()=>{scale=1;render()};$('page').onerror=()=>{$('status').textContent='Sayfa yüklenemedi. WebP dosya yolunu kontrol edin.'};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});render();</script></body></html>
