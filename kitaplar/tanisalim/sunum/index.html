<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f7f4">
<title>Tanışalım · Sunum Modu</title>
<style>
:root{color-scheme:light;--bg:#f2f7f4;--teal:#167b70;--teal2:#39aa99;--ink:#183b3c;--muted:#718383;--line:#dbe8e2;--paper:#fffefa;--shadow:0 16px 38px #17483a10}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}body{overflow:hidden}button{font:inherit;color:inherit}.app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr);padding:0 clamp(12px,2.4vw,34px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);min-width:0}.brand{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap}.mark{width:31px;height:31px;display:grid;place-items:center;background:var(--teal);color:#fff;border-radius:10px}.brand small{display:block;margin-top:1px;font-size:9px;letter-spacing:.14em;color:var(--muted)}.header-right{display:flex;gap:8px;align-items:center}.back,.plain-btn{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#ffffffc9;text-decoration:none;font-size:12px;font-weight:750;cursor:pointer}.back:hover,.plain-btn:hover{border-color:#8fc9b9;color:var(--teal)}main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;padding:14px 0 16px}.viewer{min-width:0;min-height:0;display:grid;grid-template-rows:40px minmax(0,1fr) 61px;gap:8px}.toolbar{display:flex;align-items:center;gap:8px;padding:0 4px}.nav-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:11px;background:var(--paper);font-weight:900;cursor:pointer}.nav-btn:disabled{opacity:.35;cursor:default}.page-count{min-width:76px;text-align:center;font-size:12px;color:var(--muted);font-weight:750}.progress{height:4px;border-radius:9px;background:#dce9e3;overflow:hidden;flex:1;margin:0 8px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));transition:width .2s}.slide-area{min-height:0;display:grid;place-items:center;overflow:hidden}.slide-frame{position:relative;width:min(100%,calc((100dvh - 185px)*1.77778));max-height:100%;aspect-ratio:16/9;background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.slide-img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}.hotspot{position:absolute;z-index:2;min-width:10px;min-height:16px;padding:0;border:0;border-radius:5px;background:transparent;cursor:pointer;transform:translateZ(0)}.hotspot:hover,.hotspot:focus-visible{outline:2px solid #f0b535;background:#f0b53522}.hotspot.selected{outline:2px solid var(--teal2);background:#20a99520}.thumbs{display:flex;align-items:stretch;gap:7px;overflow-x:auto;overflow-y:hidden;padding:3px 2px 7px;scrollbar-width:thin;scrollbar-color:#a9c9bd transparent}.thumb{position:relative;flex:0 0 75px;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:3px;cursor:pointer;opacity:.75}.thumb img{display:block;width:100%;height:43px;object-fit:cover;border-radius:5px}.thumb span{display:block;font-size:9px;color:var(--muted);text-align:center;margin-top:2px}.thumb.active{border:2px solid var(--teal);padding:2px;opacity:1}.thumb.active span{color:var(--teal);font-weight:850}.side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:1px 2px 2px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:15px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.panel-title h2{margin:0;font-size:11px;letter-spacing:.1em;color:#68817c}.count-pill{font-size:10px;color:var(--muted);font-weight:800}.languages{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.lang{min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px 2px 6px;cursor:pointer;font-size:10px;font-weight:800}.lang span{display:block;font-size:17px;line-height:18px;margin-bottom:3px}.lang.active{border:2px solid var(--teal2);background:#e9f6f1;color:var(--teal);padding:6px 1px 5px}.hint{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.selection{min-height:145px}.empty{min-height:120px;display:grid;place-items:center;text-align:center;padding:14px;color:var(--muted);font-size:12px;line-height:1.55}.empty .finger{font-size:25px;margin-bottom:7px}.type-label{margin:2px 0 5px;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.word-title{margin:0 0 7px;font-family:Georgia,serif;font-size:23px;line-height:1.15;overflow-wrap:anywhere}.lemma{margin:0 0 9px;color:#66807a;font-size:11px}.translation{padding:11px 12px;border:1px solid #e3eee8;border-radius:12px;background:#f8faf7;font-size:16px;font-weight:800;line-height:1.35}.form-translation{margin-top:7px;color:#46635f;font-size:12px;line-height:1.4}.example{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.example strong{display:block;margin-bottom:4px;color:#68817c;font-size:9px;letter-spacing:.09em}.example p{margin:3px 0;font-size:12px;line-height:1.45}.example .translated{color:var(--muted)}.audio-box{display:flex;flex-direction:column;gap:7px}.listen{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border:0;border-radius:11px;background:var(--teal);color:white;font-size:12px;font-weight:850;cursor:pointer}.listen:hover{background:#116a61}.listen.playing{background:#bd7043}.no-audio{color:var(--muted);font-size:11px;line-height:1.45}.bottom-note{margin-top:auto;padding:1px 4px 3px;color:var(--muted);font-size:10px;line-height:1.4}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);padding:10px 14px;border-radius:999px;background:#173d3b;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{grid-column:1/-1;display:grid;place-items:center;color:var(--muted);font-size:14px}
@media(max-width:860px){body{overflow:auto}.app{height:auto;min-height:100dvh;grid-template-rows:56px auto;padding:0 12px}main{display:flex;flex-direction:column;padding:10px 0 20px;gap:12px}.viewer{display:grid;grid-template-rows:38px auto 65px;gap:7px}.slide-area{overflow:visible}.slide-frame{width:100%;max-height:none;border-radius:10px}.side{overflow:visible;display:grid;grid-template-columns:1fr 1fr;align-items:start}.panel{padding:13px;border-radius:14px}.panel.languages-panel{grid-column:1/-1}.panel.selection{grid-column:1/-1}.bottom-note{grid-column:1/-1}.header-right .back{padding:7px 9px;font-size:10px}.thumb{flex-basis:68px}.thumb img{height:38px}}
@media(max-width:520px){.brand{font-size:13px}.brand small{font-size:8px}.header-right .back{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side{display:flex}.panel-title h2{font-size:10px}.word-title{font-size:21px}.toolbar{gap:5px}.progress{margin:0 3px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark">T</span><span>Türkçe Akademi<small>A1 · TANIŞALIM · SUNUM MODU</small></span></div>
    <div class="header-right"><button class="plain-btn" id="fullBtn" title="Tam ekran">⛶</button><a class="back" href="../index.html">PDF Modu’na dön</a></div>
  </header>
  <main id="main"><div class="loading">Sunum sayfaları yükleniyor…</div></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const langs=[{id:'en',label:'EN',flag:'🇬🇧',index:0},{id:'ru',label:'RU',flag:'🇷🇺',index:1},{id:'ky',label:'KY',flag:'🇰🇬',index:2},{id:'ar',label:'AR',flag:'🇸🇦',index:3},{id:'fr',label:'FR',flag:'🇫🇷',index:4}];
  const main=document.getElementById('main'),toast=document.getElementById('toast');let slides=[],spots=[],dict={},current=0,lang='en',selected=null,audioNodes=[];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200)}
  async function init(){
    try{
      const [data,hitData,translations]=await Promise.all([fetch('assets/slides.json').then(r=>r.json()),fetch('assets/word-spots.json').then(r=>r.json()),fetch('../translations.json').then(r=>r.json())]);
      slides=data.slides;spots=hitData;dict=translations;current=Math.min(Number(localStorage.getItem('sunum-current')||0),slides.length-1);lang=localStorage.getItem('sunum-language')||'en';
      renderShell();renderSlide();
    }catch(e){main.innerHTML='<section class="panel"><h2>Sunum açılamadı</h2><p>Slayt dosyaları yüklenirken bir sorun oluştu. Sayfayı yenileyin.</p></section>';console.error(e)}
  }
  function renderShell(){
    main.innerHTML=`<section class="viewer"><div class="toolbar"><button class="nav-btn" id="prev" aria-label="Önceki slayt">←</button><span class="page-count" id="pageCount"></span><button class="nav-btn" id="next" aria-label="Sonraki slayt">→</button><div class="progress"><span id="progressFill"></span></div><button class="nav-btn" id="first" aria-label="İlk slayt">|←</button><button class="nav-btn" id="last" aria-label="Son slayt">→|</button></div><div class="slide-area"><div class="slide-frame" id="frame"><img class="slide-img" id="slideImg" alt="" draggable="false"><div id="hotspots"></div></div></div><div class="thumbs" id="thumbs" aria-label="Slayt küçük görselleri"></div></section>
      <aside class="side"><section class="panel languages-panel"><div class="panel-title"><h2>ÇEVİRİ DİLİ</h2><span class="count-pill">${slides.length} slayt</span></div><div class="languages" id="languages"></div><p class="hint" style="margin-top:10px">Slayttaki çevrilebilir bir kelimeye dokunun; kalıp ifadeler birlikte seçilir.</p></section>
      <section class="panel selection" id="translationPanel"><div class="panel-title"><h2>SÖZLÜK VE ÖRNEK</h2><span class="count-pill" id="hitCount"></span></div><div class="empty"><div><div class="finger">☝️</div>Slayttaki vurgulanabilir kelimelerden birine dokunun.<br>Anlam ve örnek seçtiğiniz dilde görünür.</div></div></section>
      <section class="panel"><div class="panel-title"><h2>DİNLEME</h2><span class="count-pill" id="audioCaption"></span></div><div class="audio-box" id="audioBox"></div></section><p class="bottom-note">Cevaplar sunudaki etkinliklerin üzerinde gösterilir. Dinleme, slayt değişince durur.</p></aside>`;
    document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('first').onclick=()=>go(0);document.getElementById('last').onclick=()=>go(slides.length-1);
    document.getElementById('languages').innerHTML=langs.map(l=>`<button class="lang ${l.id===lang?'active':''}" data-lang="${l.id}" aria-label="${l.label}"><span>${l.flag}</span>${l.label}</button>`).join('');
    document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('sunum-language',lang);document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x===b));if(selected)showEntry(selected)});
    const thumbs=document.getElementById('thumbs');thumbs.innerHTML=slides.map((s,i)=>`<button class="thumb" data-i="${i}" aria-label="Slayt ${i+1}"><img loading="lazy" src="${s.image}" alt=""><span>${i+1}</span></button>`).join('');thumbs.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>go(Number(b.dataset.i)));
    document.getElementById('fullBtn').onclick=()=>{const el=document.documentElement;if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});
  }
  function stopAudio(){audioNodes.forEach(a=>{a.pause();a.currentTime=0});audioNodes=[];document.querySelectorAll('.listen').forEach(b=>{b.classList.remove('playing');b.innerHTML='▶ DİNLE'})}
  function go(n){if(n<0||n>=slides.length)return;stopAudio();current=n;selected=null;localStorage.setItem('sunum-current',String(current));renderSlide()}
  function renderSlide(){
    const s=slides[current],img=document.getElementById('slideImg');img.src=s.image;img.alt=`A1 Tanışalım, slayt ${current+1}`;
    document.getElementById('pageCount').textContent=`${current+1} / ${slides.length}`;document.getElementById('progressFill').style.width=`${(current+1)/slides.length*100}%`;
    document.getElementById('prev').disabled=current===0;document.getElementById('first').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('last').disabled=current===slides.length-1;
    document.querySelectorAll('.thumb').forEach((b,i)=>{b.classList.toggle('active',i===current);if(i===current)b.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})});
    const list=spots[current]||[],box=document.getElementById('hotspots');box.innerHTML=list.map((h,i)=>`<button class="hotspot" data-hit="${i}" title="${esc(h.text)}" aria-label="${esc(h.text)}" style="left:${h.x*100}%;top:${h.y*100}%;width:${Math.max(h.w*100,0.8)}%;height:${Math.max(h.h*100,2.2)}%"></button>`).join('');
    box.querySelectorAll('.hotspot').forEach(b=>b.onclick=()=>{box.querySelectorAll('.hotspot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=list[Number(b.dataset.hit)];showEntry(selected)});
    document.getElementById('hitCount').textContent=list.length?`${list.length} kelime`:' ';
    renderAudio(s.audio);document.getElementById('translationPanel').querySelector('.empty').style.display='grid';document.getElementById('translationPanel').querySelectorAll('.entry-content').forEach(n=>n.remove());
  }
  function renderAudio(audio){const box=document.getElementById('audioBox'),caption=document.getElementById('audioCaption');box.innerHTML='';const tracks=audio?(Array.isArray(audio)?audio:[audio]):[];caption.textContent=tracks.length?`${tracks.length} kayıt`:' ';if(!tracks.length){box.innerHTML='<div class="no-audio">Bu slaytta ses kaydı yok.</div>';return}tracks.forEach((src,i)=>{const b=document.createElement('button');b.className='listen';b.innerHTML='▶ DİNLE';b.onclick=()=>{let a=b._audio;if(a&&!a.paused){a.pause();a.currentTime=0;b.classList.remove('playing');b.innerHTML='▶ DİNLE';return}stopAudio();a=new Audio(src);b._audio=a;audioNodes=[a];b.classList.add('playing');b.innerHTML='❚❚ DURDUR';a.onended=()=>{b.classList.remove('playing');b.innerHTML='▶ DİNLE'};a.onerror=()=>showToast('Ses dosyası açılamadı.');a.play().catch(()=>showToast('Ses oynatılamadı.'))};if(tracks.length>1)b.setAttribute('aria-label',`Dinleme kaydı ${i+1}`);box.appendChild(b)})}
  function showEntry(hit){
    const idx=langs.find(x=>x.id===lang)?.index??0,key=hit.key||hit.text.toLowerCase(),phrase=dict.phrases?.[key],form=dict.forms?.[key],word=dict.words?.[key],ex=dict.examples?.[key];
    const item=phrase||form||word;const transArr=phrase?.translations||form?.formTranslations||word;
    const lemma=form?.lemma;
    const exampleTr=phrase?.exampleTr||form?.exampleTr||ex?.[0];const exampleTranslations=phrase?.examples||form?.examples||ex?.[1];
    const panel=document.getElementById('translationPanel');panel.querySelector('.empty').style.display='none';panel.querySelectorAll('.entry-content').forEach(n=>n.remove());
    const el=document.createElement('div');el.className='entry-content';
    if(!item){el.innerHTML=`<div class="type-label">${langs[idx].label} · TÜRKÇE İFADE</div><h3 class="word-title">${esc(hit.text)}</h3><div class="translation">Bu kelime için çeviri kaydı bulunamadı.</div>`;}
    else{
      const translation=transArr?.[idx]||'—';
      const lemmaEntry=lemma?(dict.words?.[lemma]||null):null;const lemmaTranslation=lemmaEntry?.[idx];
      el.innerHTML=`<div class="type-label">${phrase?'KALIP İFADE':form?'KİTAPTAKİ BİÇİM':'KELİME'} · ${langs[idx].label}</div><h3 class="word-title">${esc(phrase?key:hit.text)}</h3>${form?`<div class="translation"><span style="display:block;margin-bottom:4px;color:#68817c;font-size:9px;letter-spacing:.08em">YALIN HÂL · ${esc(lemma||'')}</span>${esc(lemmaTranslation||lemma||'—')}</div><div class="form-translation">Kitaptaki biçimi: <strong>${esc(form.formTranslations[idx]||translation)}</strong></div>`:`<div class="translation">${esc(translation)}</div>`}${exampleTr?`<div class="example"><strong>ÖRNEK CÜMLE · ${langs[idx].label}</strong><p>${esc(exampleTr)}</p><p class="translated">${esc(exampleTranslations?.[idx]||'')}</p></div>`:''}`;
    }
    panel.appendChild(el);
  }
  init();
})();
</script>
</body>
</html>
