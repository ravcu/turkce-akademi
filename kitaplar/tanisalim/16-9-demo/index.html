<body>
<div class="app">
<header><div class="brand"><span class="mark">T</span><span>Türkçe Akademi<span class="sub">16:9 ETKİLEŞİMLİ DENEME</span></span></div><a class="tag" href="../index.html">← Ana kitaba dön</a></header>
<main>
<div class="slide-wrap"><div class="mobile-note">Bu deneme yatay bilgisayar ekranı için tasarlandı. Telefonda ana kitabın dikey görünümünü kullanabilirsin.</div><section class="frame" aria-label="Yatay etkinlik ekranı"><img id="slide" src="https://raw.githubusercontent.com/ravcu/turkce-akademi/main/kitaplar/tanisalim/16-9-demo/01-eslestir-tamamla.jpg" alt="Sayfa 20 etkinliklerinin yatay ekrana yerleştirilmiş görünümü"><div id="hotspots" class="hotspots"></div><div id="answers" class="answers" hidden></div><div id="audioCues" class="audio-cues"></div></section></div>
<aside class="panel" aria-live="polite"><div class="panel-top"><span class="panel-label">Sözlük ve örnek</span><button id="speak" class="action" disabled>🔊 Türkçe dinle</button></div><div class="language-tabs" role="tablist" aria-label="Çeviri dili"><button class="language-tab" role="tab" aria-selected="true" data-lang="en"><span>🇬🇧</span>EN</button><button class="language-tab" role="tab" aria-selected="false" data-lang="ru"><span>🇷🇺</span>RU</button><button class="language-tab" role="tab" aria-selected="false" data-lang="ky"><span>🇰🇬</span>KY</button><button class="language-tab" role="tab" aria-selected="false" data-lang="ar"><span>🇸🇦</span>AR</button><button class="language-tab" role="tab" aria-selected="false" data-lang="fr"><span>🇫🇷</span>FR</button></div><div id="translation"><div class="empty">Kitaptaki bir kelimeye ya da ifadeye dokun. Anlamı ve örnek cümlesi seçtiğin dilde burada görünsün.</div></div><div class="panel-actions"><button id="answerToggle" class="action">Cevapları göster</button><button id="readPage" class="action">🔊 Metni oku</button></div><div id="answerList" class="answer-box" hidden></div></aside>
</main>
<footer><div class="nav"><button class="btn" id="prev" aria-label="Önceki ekran">←</button><span class="counter" id="counter">1 / 3</span><button class="btn" id="next" aria-label="Sonraki ekran">→</button></div><button class="btn" id="full">⛶ Tam ekran</button></footer>
</div><audio id="audioPlayer" preload="none"></audio>
<script>
(()=>{
const LANGS=[['en','🇬🇧','English'],['ru','🇷🇺','Русский'],['ky','🇰🇬','Кыргызча'],['ar','🇸🇦','العربية'],['fr','🇫🇷','Français']];
const cropSlides=[
 {src:'01-eslestir-tamamla.jpg',crop:[92,48,889,358],image:[70,231,1460,568],title:'3–4. etkinlik · Tanışma ifadeleri'},
 {src:'02-diyaloglar.jpg',crop:[91,355,890,740],image:[94.5,175,1411,680],title:'5. etkinlik · Günlük tanışma konuşmaları'},
 {src:'03-soz-varligi.jpg',crop:[0,752,890,1202],image:[127.5,175,1345,680],title:'Söz varlığı · Diyalog ve görsel eşleştirme'},
 {src:'04-dinleme-021.jpg',crop:[85,112,900,615],image:[249,175,1102,680],title:'Dinleme · Günlük selamlaşmaları dinle ve tekrar et'}
];
let pageData,page20Data,page21Data,glossary,currentSlide=0,lang='en',selected=null,showAnswers=false;
const $=s=>document.querySelector(s), img=$('#slide'),hits=$('#hotspots'),answers=$('#answers'),audioLayer=$('#audioCues');
const norm=s=>String(s).normalize('NFC').trim().toLocaleLowerCase('tr-TR').replace(/^[\s.,:;!?()[\]{}"“”’…\-−•]+|[\s.,:;!?()[\]{}"“”’…\-−•]+$/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function numberEnglish(n){const a=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],b=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];if(n<20)return a[n];if(n<100)return b[Math.floor(n/10)]+(n%10?'-'+a[n%10]:'');return String(n)}
function phraseAt(index,words){const phrases=Object.keys(glossary.phrases||{}).sort((a,b)=>b.split(' ').length-a.split(' ').length);const adjacent=(a,b)=>{const dy=(b.y+b.h/2)-(a.y+a.h/2),gap=b.x-(a.x+a.w);if(Math.abs(dy)<=Math.max(.009,Math.min(a.h,b.h)*.75))return b.x>=a.x-.015&&gap<=.08;return dy>0&&dy<=.026&&b.x>=a.x-.09&&b.x<=a.x+a.w+.1};for(const phrase of phrases){const parts=phrase.split(' ');for(let start=Math.max(0,index-parts.length+1);start<=Math.min(index,words.length-parts.length);start++){const seq=words.slice(start,start+parts.length);if(!seq.some((_,j)=>start+j===index))continue;if(seq.every((w,j)=>norm(w.t)===parts[j])&&seq.slice(1).every((w,j)=>adjacent(seq[j],w)))return{key:phrase,indices:seq.map((_,j)=>start+j),text:seq.map(w=>w.t).join(' ')}}}return null}
function currentCrop(){return cropSlides[currentSlide]}
function pageToCanvas(x,y){const c=currentCrop(),[l,t,r,b]=c.crop,[ix,iy,iw,ih]=c.image,scale=iw/(r-l);return[ix+(x*950-l)*scale,iy+(y*1202-t)*scale,scale]}
function addHotspots(){hits.replaceChildren();const words=pageData.words;words.forEach((w,i)=>{if(!norm(w.t))return;const [x,y,scale]=pageToCanvas((w.x+w.w/2),(w.y+w.h/2));const c=currentCrop().crop;const px=w.x*950,py=w.y*1202,pw=w.w*950,ph=w.h*1202;if(px+pw<c[0]||px>c[2]||py+ph<c[1]||py>c[3])return;const [cx,cy]=pageToCanvas(w.x,w.y);const x2=pageToCanvas(w.x+w.w,w.y)[0],y2=pageToCanvas(w.x,w.y+w.h)[1];const el=document.createElement('button');el.className='word-hit';el.type='button';el.title=`${w.t} — anlamını göster`;el.setAttribute('aria-label',`${w.t} kelimesini seç`);el.dataset.index=i;el.style.left=`${cx/16}%`;el.style.top=`${cy/9}%`;el.style.width=`${Math.max(5,x2-cx)/16}%`;el.style.height=`${Math.max(7,y2-cy)/9}%`;el.addEventListener('click',()=>selectWord(i));hits.append(el)});}
function renderAudio(){audioLayer.replaceChildren();const c=currentCrop(),[l,t,r,bottom]=c.crop;pageData.words.forEach(w=>{const code=w.t.match(/^(?:S|M)\.\d{3}$/)?.[0];if(!code)return;const px=w.x*950;if(px<l||px>r||w.y*1202<t||w.y*1202>bottom)return;const [x,y,scale]=pageToCanvas(w.x+w.w,w.y);const button=document.createElement('button');button.className='audio-cue';button.textContent='DİNLE';button.title=`${code} sesini dinle`;button.style.left=`${Math.min(x+8,1500)/16}%`;button.style.top=`${Math.max(y-3,0)/9}%`;button.onclick=()=>playAudio(code);audioLayer.append(button)})}
function playAudio(code){const a=$('#audioPlayer');a.pause();a.currentTime=0;const file=code.startsWith('M.')?`Lise A1  ${code}.mp3`:`Lise - A1 - Ders Kitabı - ${Number(code.slice(2))}.mp3`;a.src=`../audio/${encodeURIComponent(file)}`;a.play().catch(()=>{})}
function showAnswerOverlay(){answers.replaceChildren();answers.hidden=!showAnswers;if(!showAnswers)return;const data=glossary.answerKeys?.[String(pageData.page)],c=currentCrop(),[l,t,r,b]=c.crop,[ix,iy,iw,ih]=c.image,scale=iw/(r-l);(data?.fills||[]).forEach(f=>{const px=f.x*950,py=f.y*1202;if(px<l||px>r||py<t||py>b)return;const [x,y]=pageToCanvas(f.x,f.y);const el=document.createElement('span');el.className='answer-fill'+(f.underline?' underline':'');el.textContent=f.text;el.style.left=`${x/16}%`;el.style.top=`${y/9}%`;el.style.width=`${Math.max(20,f.w*950*scale*1.25)/16}%`;el.style.fontSize=`${Math.max(8,10.5*scale)}px`;answers.append(el)});}
function renderAnswersList(){const box=$('#answerList');box.replaceChildren();const data=glossary.answerKeys?.[String(pageData.page)];if(!showAnswers||!data){box.hidden=true;return}box.hidden=false;const sections=(currentSlide<3?[[0,1],[2],[3,4]][currentSlide]:[])||[];sections.forEach(i=>{const s=data.sections?.[i];if(!s)return;const div=document.createElement('div');div.className='answer-section';div.innerHTML=`<strong>${esc(s.title)}</strong><ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;box.append(div)})}
function markSelection(){hits.querySelectorAll('.word-hit').forEach(b=>{const yes=selected?.indices.includes(+b.dataset.index);b.classList.toggle('is-selected',!!yes);b.setAttribute('aria-pressed',String(!!yes))})}
function selectWord(index){const w=pageData.words[index],phrase=phraseAt(index,pageData.words),key=phrase?.key||norm(w.t),text=(phrase?.text||w.t).replace(/(^|\s)[\-−–—]+(?=\s*\S)/g,'$1').replace(/\s+/g,' ').trim();selected={key,text,phrase:!!phrase,indices:phrase?.indices||[index]};markSelection();$('#speak').disabled=false;renderTranslation()}
function speak(text,language='tr'){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=language==='tr'?'tr-TR':language==='en'?'en-US':language==='ru'?'ru-RU':language==='ky'?'ky-KG':language==='ar'?'ar-SA':'fr-FR';speechSynthesis.speak(u)}
function renderTranslation(){if(!selected)return;const langIndex=LANGS.findIndex(x=>x[0]===lang),L=LANGS[langIndex],key=selected.key,entry=selected.phrase?glossary.phrases?.[key]:null,form=!selected.phrase?glossary.forms?.[key]:null;let raw=entry?.translations||form?.formTranslations||glossary.words?.[key]||[],meaning=/^\d+$/.test(key)&&lang==='en'?numberEnglish(+key):(raw[langIndex]||selected.text);let base='';if(form?.lemma){const lemmaKey=norm(form.lemma),trans=form.lemmaTranslations||glossary.lemmas?.[lemmaKey]?.translations||glossary.words?.[lemmaKey]||[];base=trans[langIndex]||form.lemma}let ex=entry?{tr:entry.exampleTr,values:entry.examples}:form?.exampleTr?{tr:form.exampleTr,values:form.examples}:glossary.examples?.[key];if(Array.isArray(ex))ex={tr:ex[0],values:ex[1]};if(!ex?.tr||!ex?.values)ex={tr:`${selected.text} ifadesini bugün öğrendim.`,values:[`I learned “${meaning}” today.`,`Сегодня я выучил(а) «${meaning}».`,`Мен бүгүн «${meaning}» деген сөздү үйрөндүм.`,`تعلّمت اليوم «${meaning}».`,`J’ai appris « ${meaning} » aujourd’hui.`]};const dir=lang==='ar'?' dir="rtl"':'';const card=(title,value,tag)=>`<div class="card"><div class="langname">${esc(title)}</div><div class="meaning-row"><div class="meaning"${dir}>${esc(value)}</div><button class="line-speak" data-say="${tag}" aria-label="Dinle">🔊</button></div></div>`;const both=!!(base&&form?.lemma&&norm(form.lemma)!==key);$('#translation').innerHTML=`<div class="selected">${esc(selected.text)}</div><div class="subhint">Türkçe ifade · ${esc(L[2])} anlamı</div>${both?card(`Yalın biçimi · ${form.lemma}`,base,'base')+card(`Metindeki biçimi · ${selected.text}`,meaning,'form'):card(`${L[1]} ${L[2]}`,meaning,'meaning')}<div class="example"><div class="example-title">Günlük kullanım örneği</div><div class="example-line"><div class="example-tr" lang="tr">${esc(ex.tr)}</div><button class="line-speak" data-say="tr">🔊</button></div><div class="example-line"><div class="example-target"${dir}>${esc(ex.values[langIndex])}</div><button class="line-speak" data-say="example">🔊</button></div></div><p class="footnote">Çeviri ve örnek cümle seçtiğin dilde gösterilir.</p>`;$('#translation').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say==='tr'?ex.tr:b.dataset.say==='base'?base:b.dataset.say==='example'?ex.values[langIndex]:meaning,b.dataset.say==='tr'?'tr':lang));document.querySelectorAll('.language-tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.lang===lang)))}
function hasVisibleAnswers(){const data=glossary.answerKeys?.[String(pageData.page)],c=currentCrop().crop;return (data?.fills||[]).some(f=>f.x*950>=c[0]&&f.x*950<=c[2]&&f.y*1202>=c[1]&&f.y*1202<=c[3])}
function setSlide(i){currentSlide=Math.max(0,Math.min(cropSlides.length-1,i));pageData=currentSlide<3?page20Data:page21Data;const player=$('#audioPlayer');player.pause();player.currentTime=0;selected=null;$('#answerToggle').disabled=!hasVisibleAnswers();if($('#answerToggle').disabled)showAnswers=false;$('#answerToggle').textContent=showAnswers?'Cevapları gizle':'Cevapları göster';$('#speak').disabled=true;$('#translation').innerHTML='<div class="empty">Kitaptaki bir kelimeye ya da ifadeye dokun. Anlamı ve örnek cümlesi seçtiğin dilde burada görünsün.</div>';const c=currentCrop();img.src=c.src;img.alt=c.title;$('#counter').textContent=`${currentSlide+1} / ${cropSlides.length}`;$('#prev').disabled=currentSlide===0;$('#next').disabled=currentSlide===cropSlides.length-1;addHotspots();renderAudio();showAnswerOverlay();renderAnswersList();markSelection()}
$('#prev').onclick=()=>setSlide(currentSlide-1);$('#next').onclick=()=>setSlide(currentSlide+1);$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')setSlide(currentSlide+1);if(e.key==='ArrowLeft'||e.key==='PageUp')setSlide(currentSlide-1)});document.querySelectorAll('.language-tab').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;if(selected)renderTranslation();else document.querySelectorAll('.language-tab').forEach(t=>t.setAttribute('aria-selected',String(t===b)))});$('#speak').onclick=()=>selected&&speak(selected.text);$('#answerToggle').onclick=()=>{showAnswers=!showAnswers;$('#answerToggle').textContent=showAnswers?'Cevapları gizle':'Cevapları göster';showAnswerOverlay();renderAnswersList()};$('#readPage').onclick=()=>{const matches=pageData.words.filter(w=>{const p=currentCrop().crop;return w.x*950>=p[0]&&w.x*950<=p[2]&&w.y*1202>=p[1]&&w.y*1202<=p[3]&&!/^S\.\d{3}$/.test(w.t)});speak(matches.map(w=>w.t).join(' '))};let touchX=0;$('.frame').addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});$('.frame').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>50)setSlide(currentSlide+(d<0?1:-1))},{passive:true});
Promise.all([fetch('../pages.json',{cache:'no-store'}).then(r=>r.json()),fetch('../translations.json',{cache:'no-store'}).then(r=>r.json())]).then(([pages,data])=>{page20Data=pages.find(p=>p.bookPage===20);page21Data=pages.find(p=>p.bookPage===21);glossary=data;if(!page20Data||!page21Data)throw Error('Sayfa 20 veya 21 bulunamadı');pageData=page20Data;setSlide(0)}).catch(e=>{$('#translation').innerHTML='<div class="empty">Kitap verisi yüklenemedi. Sayfayı yenileyin.</div>';console.error(e)});
})();
</script>
