<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f7f4">
<title>16:9 Deneme · Tanışalım</title>
<style>
:root{color-scheme:light;--bg:#f2f7f4;--teal:#167b70;--ink:#183b3c;--muted:#718383;--line:#dbe8e2;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.app{height:100dvh;min-height:0;display:grid;grid-template-rows:58px minmax(0,1fr) 64px;gap:0;padding:0 22px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);min-width:0} .brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:15px}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--teal);color:white;font-weight:800}.sub{font-size:11px;color:var(--muted);font-weight:550;margin-left:8px}.tag{border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:11px;color:var(--muted);background:#ffffffb8;white-space:nowrap}
main{min-height:0;display:grid;place-items:center;padding:10px 0}.frame{width:min(100%,calc((100dvh - 132px)*16/9));aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:18px;box-shadow:0 12px 36px #17483a15;background:white}.frame img{display:block;width:100%;height:100%;object-fit:contain}
footer{display:flex;align-items:center;justify-content:center;gap:16px}.nav{display:flex;align-items:center;gap:10px}.btn{height:40px;min-width:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font:700 15px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;box-shadow:0 2px 6px #17483a08}.btn:hover:not(:disabled){border-color:#8fc9b9;background:#f9fffc}.btn:disabled{opacity:.42;cursor:default}.counter{min-width:62px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}.hint{position:absolute;right:14px;bottom:12px;color:#fff9;background:#183b3c66;border-radius:8px;padding:5px 8px;font-size:10px;opacity:0;transition:opacity .2s}.frame:hover .hint{opacity:1}
@media(max-width:640px){.app{grid-template-rows:52px minmax(0,1fr) 58px;padding:0 10px}.brand{font-size:13px}.sub{display:none}.tag{font-size:10px;padding:6px 9px}.frame{width:100%;border-radius:12px}.btn{height:38px}.hint{display:none}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><span class="mark">T</span><span>Türkçe Akademi<span class="sub">16:9 SAYFA DENEMESİ</span></span></div><div class="tag">Tanışalım · Kitap sayfası 20</div></header>
<main><section class="frame" aria-label="Yatay etkinlik ekranı"><img id="slide" src="01-eslestir-tamamla.jpg" alt="Sayfa 20 etkinliklerinin yatay ekrana yerleştirilmiş deneme görünümü"><span class="hint">Geniş ekran · 16:9</span></section></main>
<footer><div class="nav"><button class="btn" id="prev" aria-label="Önceki ekran">←</button><span class="counter" id="counter">1 / 3</span><button class="btn" id="next" aria-label="Sonraki ekran">→</button></div><button class="btn" id="full" title="Tam ekran görünüm">⛶ Tam ekran</button></footer>
</div>
<script>
const slides=[
 {src:'01-eslestir-tamamla.jpg',alt:'3 ve 4. etkinlik: ifadeleri eşleştirme ve tanıtım cümlesini tamamlama'},
 {src:'02-diyaloglar.jpg',alt:'5. etkinlik: iki günlük tanışma diyaloğunu tamamlama'},
 {src:'03-soz-varligi.jpg',alt:'Söz varlığı: diyalog tamamlama ve ifadeleri görsellerle eşleştirme'}
];let index=0;const img=document.getElementById('slide'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');
function show(i){index=Math.max(0,Math.min(slides.length-1,i));img.src=slides[index].src;img.alt=slides[index].alt;counter.textContent=`${index+1} / ${slides.length}`;prev.disabled=index===0;next.disabled=index===slides.length-1}
prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')show(index+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(index-1)});let startX=0;document.querySelector('.frame').addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});document.querySelector('.frame').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45)show(index+(dx<0?1:-1))},{passive:true});show(0);
</script>
</body>
</html>
