<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yeni Sınıf Arkadaşım — Türkçe Akademi</title><style>:root{font:16px system-ui,Arial;color:#17343c;background:#eff6f5}*{box-sizing:border-box}body{margin:0}header{background:#087f83;color:white;padding:18px 5%}header a{color:white}main{max-width:850px;margin:22px auto;padding:0 14px}.card{background:white;border-radius:17px;padding:22px;margin-bottom:15px;box-shadow:0 3px 16px #1232}.muted{color:#61777a}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.bar{height:9px;background:#e2eeeb;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:#087f83;transition:width .2s}button,input,textarea{font:inherit}button{border:1px solid #b7d1ce;background:#fff;padding:11px 14px;border-radius:10px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:#087f83;color:white;border-color:#087f83}.option{display:block;text-align:left;width:100%;margin:9px 0}.selected{border:2px solid #087f83;background:#e4f5f2}.correct{border-color:#16875b;background:#e3f6ea}.wrong{border-color:#c74e43;background:#fff0ec}.bubble{background:#e7f4f1;border-radius:14px;padding:17px;margin:15px 0}input,textarea{width:100%;padding:13px;border:1px solid #b9cfcc;border-radius:10px}textarea{min-height:100px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#f0f7f6}.feedback{background:#f4f8f8;border-left:4px solid #087f83;padding:13px;margin-top:15px;border-radius:8px}.hidden{display:none}a{color:#087f83}h1{font-size:1.7rem}h2{font-size:1.25rem}@media(max-width:600px){.card{padding:16px}}</style></head><body><header><b>TÜRKÇE AKADEMİ</b> · Lise A1 · 1. Ünite</header><main><section class="card"><h1>Yeni Sınıf Arkadaşım</h1><p class="muted">Görev: Yeni gelen bir öğrenciyle tanış, doğru cümleler kur ve konuşmayı tamamla. Kaynak: Lise A1 Ders Kitabı s. 19–32 ve Dilbilgisi ve Telaffuz s. 10–17.</p><div class="row"><span id="counter"></span><button id="reset">Baştan başla</button></div><div class="bar"><span id="fill"></span></div></section><section id="task" class="card"><small id="skill" class="muted"></small><h2 id="heading"></h2><div id="scene" class="bubble"></div><div id="work"></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div class="row" style="margin-top:18px"><button id="check" class="primary">Kontrol et</button><button id="next" class="primary hidden">Sonraki aşama →</button><a id="source" target="_blank" rel="noopener">Kaynak PDF</a></div></section><section id="end" class="card hidden"><h2>Görev tamamlandı!</h2><p id="summary"></p><div id="review"></div><button class="primary" id="repeat">Yeniden dene</button></section></main><script>
const tasks=[
{kind:'choice',skill:'İletişim · selamlaşma',title:'1. İlk karşılaşma',scene:'Zarina: Merhaba! Benim adım Zarina. Senin adın ne?',options:['Benim adım Akira.','Ben on beş yaşındayım.','Hoşça kal.'],answer:0,why:'“Senin adın ne?” sorusuna adımızı söyleyerek cevap veririz.',book:'ders',page:19},
{kind:'order',skill:'Cümle kurma · söz dizimi',title:'2. Kendini tanıt',scene:'Akira, kendisini tanıtmak istiyor. Kelimeleri doğru sıraya koy.',tokens:['adım','Akira.','Benim'],answer:'Benim adım Akira.',why:'Türkçede bu tanışma kalıbı “Benim adım + ad” biçimindedir.',book:'ders',page:19},
{kind:'choice',skill:'İletişim · soru-cevap',title:'3. Nerelisin?',scene:'Zarina: Memnun oldum. Nerelisin, Akira?',options:['Ben Japonca konuşuyorum.','Ben Japonyalıyım.','Benim adım Akira.'],answer:1,why:'“Nerelisin?” sorusu kişinin geldiği ülkeyi veya memleketi sorar.',book:'ders',page:27},
{kind:'input',skill:'Dil bilgisi · milliyet eki',title:'4. Ülkeden milliyete',scene:'Yeni arkadaşın Rina, Tunus’tan geliyor. Cümleyi tamamla: “Ben ________.”',answer:['tunusluyum'],hint:'Tunus + -lu + -yum',why:'Tunus → Tunuslu → Tunusluyum. Ülke adı ve ek birlikte yazılır.',book:'gramer',page:14},
{kind:'order',skill:'Cümle kurma · yaş bildirme',title:'5. Kaç yaşındasın?',scene:'Zarina: Kaç yaşındasın? Akira’nın cevabını oluştur.',tokens:['yaşındayım.','On','beş'],answer:'On beş yaşındayım.',why:'Yaş belirtirken sayı + “yaşındayım” kullanılır.',book:'gramer',page:16},
{kind:'input',skill:'Dil bilgisi · dil adları',title:'6. Hangi dili konuşuyorsun?',scene:'Akira Japonya’dan geliyor. “Ben ______ konuşuyorum.” cümlesini tamamla.',answer:['japonca'],hint:'Ülke: Japonya · Dil: ?',why:'Japonya ülke, Japonca dil adıdır. Dil adları büyük harfle başlar.',book:'gramer',page:15},
{kind:'choice',skill:'Dil bilgisi · şahıs zamirleri',title:'7. Sınıf arkadaşlarını tanıt',scene:'Zarina ve Akira birlikte konuşuyor: “_____ öğrenciyiz.”',options:['Ben','Biz','Onlar'],answer:1,why:'“Biz” birinci çoğul kişi zamiridir; “öğrenciyiz” ile uyumludur.',book:'gramer',page:10},
{kind:'input',skill:'Hata düzeltme · kişi eki',title:'8. Yanlış cümleyi düzelt',scene:'Akira şöyle yazdı: “Ben on beş yaşındasın.” Cümlenin tamamını doğru yaz.',answer:['ben on beş yaşındayım','on beş yaşındayım'],hint:'Ben → ...-yım',why:'“Ben” öznesiyle “yaşındayım” kullanılır; “yaşındasın” ikinci tekil kişidir.',book:'gramer',page:16},
{kind:'choice',skill:'Telaffuz · ünlü harfler',title:'9. Sesleri ayırt et',scene:'Aşağıdaki seçeneklerden yalnızca ince ünlüler içeren grubu seç.',options:['a, ı, o, u','e, i, ö, ü','a, e, ı, i'],answer:1,why:'İnce ünlüler e, i, ö, ü; kalın ünlüler a, ı, o, u harfleridir.',book:'gramer',page:11},
{kind:'choice',skill:'İletişim · vedalaşma',title:'10. Konuşmayı bitir',scene:'Zarina: Tanıştığımıza memnun oldum. Görüşürüz!',options:['Hoş bulduk.','Ben de memnun oldum. Görüşürüz!','Nerelisin?'],answer:1,why:'“Ben de memnun oldum” karşılıklı tanışma ifadesidir; “Görüşürüz” vedalaşmadır.',book:'ders',page:20},
{kind:'write',skill:'Bağımsız üretim · yazma',title:'11. Şimdi sıra sende',scene:'Kendini en az dört cümleyle tanıt: adın, ülken, yaşın ve konuştuğun dil. Sonunda bir vedalaşma ifadesi kullan.',why:'Örnek: Merhaba! Benim adım Akira. Japonyalıyım. On beş yaşındayım. Japonca konuşuyorum. Görüşürüz!',book:'ders',page:32}
];let index=0,attempts=[],picked=null,ordered=[],locked=false;const $=id=>document.getElementById(id);function norm(s){return s.toLocaleLowerCase('tr-TR').trim().replace(/[.!?;,]+$/g,'').replace(/\s+/g,' ')}function btn(text,fn,cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}function reset(){index=0;attempts=[];render();$('task').classList.remove('hidden');$('end').classList.add('hidden')}function render(){picked=null;ordered=[];locked=false;const t=tasks[index];$('counter').textContent='Aşama '+(index+1)+' / '+tasks.length;$('fill').style.width=100*index/tasks.length+'%';$('skill').textContent=t.skill;$('heading').textContent=t.title;$('scene').textContent=t.scene;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('check').classList.remove('hidden');$('check').textContent=t.kind==='write'?'Örneği göster':'Kontrol et';$('work').replaceChildren();$('source').href=t.book==='ders'?'../../tanisalim/?page='+(t.page-16):'../../lise-a1-dilbilgisi/tanisalim/?page='+(t.page-6);if(t.kind==='choice'){t.options.forEach((o,j)=>$('work').append(btn(String.fromCharCode(65+j)+'. '+o,()=>{if(locked)return;picked=j;[...$('work').children].forEach((b,k)=>b.classList.toggle('selected',k===j))},'option')))}else if(t.kind==='order'){const chosen=document.createElement('div');chosen.className='bubble';chosen.id='chosen';chosen.textContent='Cümleyi burada oluştur';$('work').append(chosen);const chips=document.createElement('div');chips.className='chips';$('work').append(chips);t.tokens.forEach((token,j)=>{let b=btn(token,()=>{if(locked||b.disabled)return;ordered.push(j);b.disabled=true;chosen.textContent=ordered.map(k=>t.tokens[k]).join(' ');},'chip');chips.append(b)});$('work').append(btn('Sıralamayı temizle',()=>{if(locked)return;ordered=[];chosen.textContent='Cümleyi burada oluştur';[...chips.children].forEach(b=>b.disabled=false)}))}else{const field=document.createElement(t.kind==='write'?'textarea':'input');field.id='response';field.placeholder=t.kind==='write'?'Merhaba! Benim adım ...':'Cevabını buraya yaz';field.autocomplete='off';$('work').append(field);if(t.hint){const p=document.createElement('p');p.className='muted';p.textContent='İpucu: '+t.hint;$('work').append(p)}}}function check(){if(locked)return;const t=tasks[index];let valid=false,ok=false,answer='';if(t.kind==='choice'){valid=picked!==null;ok=picked===t.answer;answer=valid?t.options[picked]:''}else if(t.kind==='order'){valid=ordered.length===t.tokens.length;answer=ordered.map(k=>t.tokens[k]).join(' ');ok=norm(answer)===norm(t.answer)}else{answer=$('response').value.trim();valid=answer.length>0;ok=t.kind==='write'?null:t.answer.some(a=>norm(answer)===norm(a))}if(!valid){$('feedback').textContent='Önce bir cevap ver.';$('feedback').classList.remove('hidden');return}locked=true;attempts.push({title:t.title,ok,answer,expected:t.kind==='choice'?t.options[t.answer]:t.kind==='write'?'Öğretmen değerlendirmesi gerekir.':Array.isArray(t.answer)?t.answer[0]:t.answer});$('feedback').textContent=(ok===null?'Örnek metin (otomatik puanlanmaz): ':ok?'✓ Doğru! ':'✗ Henüz doğru değil. ')+(ok===false?'Doğru cevap: '+attempts.at(-1).expected+'. ':'')+t.why;$('feedback').classList.remove('hidden');$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===tasks.length-1?'Sonuçları gör':'Devam et →';if(t.kind==='choice'){[...$('work').children].forEach((b,j)=>{b.disabled=true;if(j===t.answer)b.classList.add('correct');else if(j===picked)b.classList.add('wrong')})}}function next(){index++;if(index<tasks.length){render();return}const graded=attempts.filter(a=>a.ok!==null),right=graded.filter(a=>a.ok).length;$('task').classList.add('hidden');$('end').classList.remove('hidden');$('fill').style.width='100%';$('counter').textContent='Tamamlandı';$('summary').textContent=right+' / '+graded.length+' otomatik değerlendirilen aşama doğru. Yazma görevi puanlanmadı.';const review=$('review');review.replaceChildren();attempts.forEach((a,i)=>{const p=document.createElement('p');p.textContent=(a.ok===true?'✓ ':a.ok===false?'✗ ':'✎ ')+a.title+' — '+(a.ok===false?'Doğru: '+a.expected:a.ok===null?'Yazdığın metin: '+a.answer:'Doğru');review.append(p)})}$('check').onclick=check;$('next').onclick=next;$('reset').onclick=reset;$('repeat').onclick=reset;reset();</script></body></html>
