# Keep large media in GitHub; HTML/JSON/JavaScript remain in GitHub Pages.
encoding: utf-8
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - tools
  - tests
  - '**/*.mp3'
  - '**/*.wav'
  - '**/*.opus'
  - '**/*.ogg'
  - '**/*.m4a'
  - '**/*.aac'
  - '**/*.flac'
  - '**/*.webp'
  - '**/*.png'
  - '**/*.jpg'
  - '**/*.jpeg'
  - '**/*.gif'
  - '**/*.svg'
  - '**/*.ico'
  - '**/*.mp4'
  - '**/*.webm'
  - '**/*.woff'
  - '**/*.woff2'
  - '**/*.ttf'
  - '**/*.otf'
  - '**/*.pdf'
